<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On-Call Agent &mdash; Status</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --border: #1e2a44;
    --text: #e6edf6;
    --muted: #8b98ad;
    --pending: #3a465c;
    --in-progress: #3b82f6;
    --awaiting: #f59e0b;
    --done: #22c55e;
    --blocked: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 32px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .meta { display: flex; gap: 28px; align-items: flex-end; }
  .bug { font-size: 13px; }
  .bug .tag { color: var(--muted); font-size: 11px; }
  .confidence { width: 240px; }
  .confidence .label { font-size: 11px; color: var(--muted); margin-bottom: 5px; display: flex; justify-content: space-between; }
  .confidence .bar { height: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .confidence .fill { height: 100%; background: var(--in-progress); transition: width .35s ease; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .step { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 15px 16px; }
  .step .num { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .step .label { font-size: 13px; margin-top: 7px; line-height: 1.35; min-height: 34px; }
  .badge { display: inline-block; margin-top: 12px; font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .status-pending     { border-left: 3px solid var(--pending); }
  .status-in_progress { border-left: 3px solid var(--in-progress); }
  .status-awaiting_approval { border-left: 3px solid var(--awaiting); }
  .status-done        { border-left: 3px solid var(--done); }
  .status-blocked     { border-left: 3px solid var(--blocked); }
  .badge-pending     { color: var(--muted);    border-color: var(--pending); }
  .badge-in_progress { color: var(--in-progress); border-color: var(--in-progress); }
  .badge-awaiting_approval { color: var(--awaiting); border-color: var(--awaiting); }
  .badge-done        { color: var(--done);    border-color: var(--done); }
  .badge-blocked     { color: var(--blocked); border-color: var(--blocked); }
  .footer { margin-top: 18px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>On-Call Agent</h1>
      <div class="sub">Live status &mdash; refreshes every second</div>
    </div>
    <div class="meta">
      <div class="bug"><span class="tag">Bug:</span> <span id="bug">&mdash;</span></div>
      <div class="confidence">
        <div class="label"><span>Root-cause confidence</span><span id="confText">0%</span></div>
        <div class="bar"><div class="fill" id="confFill" style="width:0%"></div></div>
      </div>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <div class="footer">
    <span id="progress">0 / 0 done</span>
    <span id="updated">&mdash;</span>
  </div>

  <script>
    const STATUS_TEXT = {
      pending: "Pending",
      in_progress: "In progress",
      awaiting_approval: "Awaiting approval",
      done: "Done",
      blocked: "Blocked",
    };
    const grid = document.getElementById("grid");

    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }
    function timeAgo(ms) {
      const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
      if (s < 5) return "just now";
      if (s < 60) return s + "s ago";
      const m = Math.floor(s / 60);
      if (m < 60) return m + "m ago";
      return Math.floor(m / 60) + "h ago";
    }

    function render(state) {
      const wf = state.workflow || {};
      document.getElementById("bug").textContent = state.bug || "—";
      const conf = wf.rootCauseConfidence ?? 0;
      document.getElementById("confText").textContent = conf + "%";
      document.getElementById("confFill").style.width = conf + "%";
      document.getElementById("confFill").style.background = conf >= 95 ? "var(--done)" : "var(--in-progress)";

      const steps = wf.steps || [];
      grid.innerHTML = steps.map((s) => {
        const st = s.status || "pending";
        return '<div class="step status-' + st + '">' +
          '<div class="num">Step ' + s.id + '</div>' +
          '<div class="label">' + esc(s.label) + '</div>' +
          '<span class="badge badge-' + st + '">' + (STATUS_TEXT[st] || st) + '</span>' +
        '</div>';
      }).join("");

      const done = steps.filter((s) => s.status === "done").length;
      document.getElementById("progress").textContent = done + " / " + steps.length + " done";
      document.getElementById("updated").textContent =
        "updated " + timeAgo(state.updatedAt) + " · source: " + (state.source || "—");
    }

    async function tick() {
      try {
        const res = await fetch("/state", { cache: "no-store" });
        render(await res.json());
      } catch (e) {
        document.getElementById("updated").textContent = "offline — server not reachable";
      }
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
