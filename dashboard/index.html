<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On-Call Agent &mdash; Status</title>
<style>
  :root {
    --bg: #0b1220; --panel: #111a2e; --border: #1e2a44; --text: #e6edf6; --muted: #8b98ad;
    --pending: #3a465c; --in-progress: #3b82f6; --awaiting: #f59e0b; --done: #22c55e; --blocked: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 32px; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .count { font-size: 12px; color: var(--muted); }

  .sessions { display: flex; flex-direction: column; gap: 16px; }
  .session { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .s-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
  .s-title { font-size: 15px; font-weight: 600; }
  .s-title .sid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .confidence { width: 220px; }
  .confidence .label { font-size: 11px; color: var(--muted); margin-bottom: 5px; display: flex; justify-content: space-between; }
  .confidence .bar { height: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .confidence .fill { height: 100%; background: var(--in-progress); transition: width .35s; }
  .activity { margin-top: 8px; font-size: 12px; color: var(--text); }
  .activity .tag { color: var(--muted); }

  .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 14px; }
  .step { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .step .num { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .step .name { font-size: 12px; margin-top: 5px; line-height: 1.25; }
  .badge { display: inline-block; margin-top: 8px; font-size: 10px; padding: 2px 7px; border-radius: 999px; border: 1px solid; }

  .status-pending { border-left: 3px solid var(--pending); }
  .status-in_progress { border-left: 3px solid var(--in-progress); }
  .status-awaiting_approval { border-left: 3px solid var(--awaiting); }
  .status-done { border-left: 3px solid var(--done); }
  .status-blocked { border-left: 3px solid var(--blocked); }
  .badge-pending { color: var(--muted); border-color: var(--pending); }
  .badge-in_progress { color: var(--in-progress); border-color: var(--in-progress); }
  .badge-awaiting_approval { color: var(--awaiting); border-color: var(--awaiting); }
  .badge-done { color: var(--done); border-color: var(--done); }
  .badge-blocked { color: var(--blocked); border-color: var(--blocked); }

  .history { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  .history .h-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
  .h-item { display: flex; gap: 10px; font-size: 12px; padding: 3px 0; }
  .h-step { color: var(--muted); font-family: ui-monospace, Menlo, monospace; flex-shrink: 0; }
  .h-summary { color: var(--text); }
  .h-time { color: var(--muted); font-size: 11px; margin-left: auto; flex-shrink: 0; }

    .datareq { margin-top: 12px; background: rgba(245,158,11,.08); border: 1px solid var(--awaiting); border-radius: 8px; padding: 10px 14px; }
  .datareq .d-title { font-size: 11px; color: var(--awaiting); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
  .d-item { font-size: 12px; padding: 3px 0; }
  .d-layer { color: var(--awaiting); font-weight: 600; margin-right: 6px; }
  .d-query { font-family: ui-monospace, Menlo, monospace; }
  .d-why { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .empty { color: var(--muted); font-size: 13px; padding: 40px; text-align: center; border: 1px dashed var(--border); border-radius: 12px; }
  .footer { margin-top: 18px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>On-Call Agent</h1>
      <div class="sub">Live status &mdash; refreshes every second</div>
    </div>
    <div class="count" id="count">&mdash;</div>
  </header>

  <div class="sessions" id="content"></div>
  <div class="footer" id="updated">&mdash;</div>

  <script>
    const STATUS_TEXT = { pending: "Pending", in_progress: "In progress", awaiting_approval: "Awaiting approval", done: "Done", blocked: "Blocked" };

    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }
    function timeAgo(ms) {
      const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
      if (s < 5) return "just now";
      if (s < 60) return s + "s ago";
      const m = Math.floor(s / 60);
      if (m < 60) return m + "m ago";
      return Math.floor(m / 60) + "h ago";
    }
    function title(s) {
      return s.bug || s.sessionName || ("Session " + (s.sessionId || "").slice(0, 8));
    }

    function renderSession(s) {
      const wf = s.workflow || {};
      const steps = wf.steps || [];
      const conf = wf.rootCauseConfidence ?? 0;
      const history = (s.history || []).slice(-5).reverse();
      const sid = (s.sessionId || "").slice(0, 8);

      const stepsHtml = steps.map((st) => {
        const status = st.status || "pending";
        return '<div class="step status-' + status + '" title="Step ' + st.id + ': ' + esc(st.label) + '">' +
          '<div class="num">Step ' + st.id + '</div>' +
          '<div class="name">' + esc(st.name) + '</div>' +
          '<span class="badge badge-' + status + '">' + (STATUS_TEXT[status] || status) + '</span>' +
        '</div>';
      }).join("");

      const histHtml = history.map((h) =>
        '<div class="h-item">' +
          '<span class="h-step">S' + h.step + '</span>' +
          '<span class="h-summary">' + esc(h.summary || "") + '</span>' +
          '<span class="h-time">' + timeAgo(h.at) + '</span>' +
        '</div>'
      ).join("");

      const trials = (s.trials || []).slice(-6).reverse();
      const trialsHtml = trials.map((t) =>
        '<div class="h-item">' +
          '<span class="h-step">#' + t.attempt + '</span>' +
          '<span class="h-summary">' + esc(t.approach) + ' → ' + esc(t.verdict || "") + '</span>' +
          '<span class="h-time">' + timeAgo(t.at) + '</span>' +
        '</div>'
      ).join("");

      const openData = (s.pendingData || []).filter((d) => !d.resolved);
      const dataHtml = openData.map((d) =>
        '<div class="d-item">' +
          '<span class="d-layer">[' + esc(d.layer || "data") + ']</span>' +
          '<span class="d-query">' + esc(d.query || "") + '</span>' +
          (d.why ? '<div class="d-why">why: ' + esc(d.why) + '</div>' : '') +
        '</div>'
      ).join("");

      return '<div class="session">' +
        '<div class="s-head">' +
          '<div class="s-title">' + esc(title(s)) + '<span class="sid">' + esc(sid) + '</span></div>' +
          '<div class="confidence">' +
            '<div class="label"><span>Confidence</span><span>' + conf + '%</span></div>' +
            '<div class="bar"><div class="fill" style="width:' + conf + '%;background:' + (conf >= 95 ? 'var(--done)' : 'var(--in-progress)') + '"></div></div>' +
          '</div>' +
        '</div>' +
        (s.activity ? '<div class="activity"><span class="tag">Now:</span> ' + esc(s.activity) + '</div>' : '') +
        (dataHtml ? '<div class="datareq"><div class="d-title">Needs data from you</div>' + dataHtml + '</div>' : '') +
        '<div class="steps">' + stepsHtml + '</div>' +
        (histHtml ? '<div class="history"><div class="h-title">Checkpoints</div>' + histHtml + '</div>' : '') +
        (trialsHtml ? '<div class="history"><div class="h-title">Trials (root-cause attempts)</div>' + trialsHtml + '</div>' : '') +
      '</div>';
    }

    function render(sessions) {
      const content = document.getElementById("content");
      document.getElementById("count").textContent = sessions.length
        ? sessions.length + " active session" + (sessions.length > 1 ? "s" : "")
        : "no active sessions";
      if (!sessions.length) {
        content.innerHTML = '<div class="empty">No active sessions &mdash; start an on-call bug fix and this screen will populate.</div>';
        return;
      }
      content.innerHTML = sessions.map(renderSession).join("");
    }

    async function tick() {
      try {
        const res = await fetch("/state", { cache: "no-store" });
        const data = await res.json();
        render(data.sessions || []);
        document.getElementById("updated").textContent = "live";
      } catch (e) {
        document.getElementById("updated").textContent = "offline — server not reachable";
      }
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
